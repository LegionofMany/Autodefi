:root{--bg:#050814;--panel:#0a1325;--panel2:#0d1930;--line:#1e335a;--txt:#eaf2ff;--muted:#8ea2c6;--blue:#1688ff;--cyan:#02d5ff;--green:#00e878;--purple:#8b4dff;--orange:#ff9f1c;--red:#ff405c;--yellow:#ffd43b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% -8%,rgba(22,136,255,.3),transparent 34%),radial-gradient(circle at 84% 0,rgba(139,77,255,.24),transparent 32%),#050814;color:var(--txt);font-family:Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px;background:linear-gradient(180deg,rgba(5,8,20,.98),rgba(6,16,31,.97));border-right:1px solid rgba(142,162,198,.18)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:54px;height:40px}.brand b{font-size:22px}.brand b span{color:#14b8ff}.brand small{color:#a78bfa}.health,.side-card,.panel,.metric,.route-card{background:linear-gradient(180deg,rgba(13,25,48,.88),rgba(7,15,30,.86));border:1px solid rgba(74,103,159,.42);box-shadow:0 20px 60px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.04);border-radius:13px}.health{padding:18px;margin-bottom:14px}.health-row{display:flex;gap:13px;align-items:center}.health h3,.panel h2,.panel h3{margin:0}.health .score{font-size:28px;font-weight:800}.spark{height:34px}.nav{display:grid;gap:5px}.nav a{display:flex;gap:10px;align-items:center;color:#cdd9ee;text-decoration:none;border:1px solid transparent;border-radius:10px;padding:10px 12px}.nav a.active,.nav a:hover{background:linear-gradient(90deg,rgba(139,77,255,.72),rgba(22,136,255,.2));border-color:rgba(139,77,255,.75);color:white}.side-card{padding:16px;margin-top:14px}.side-card .big{font-size:26px;font-weight:800}.side-card small,.metric small,.muted{color:var(--muted)}.main{min-width:0;padding:18px 22px 26px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:14px}.title h1{margin:0 0 4px;font-size:30px}.title p{margin:0;color:#b8c6df}.wallet{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(74,103,159,.52);background:rgba(8,18,35,.78);padding:9px 12px;border-radius:10px}.gain{color:var(--green)}.tabs{display:flex;overflow:auto;border:1px solid rgba(74,103,159,.4);border-radius:10px;margin-bottom:14px;background:rgba(6,14,28,.75)}.tabs a{color:#b9c6df;text-decoration:none;padding:12px 20px;border-right:1px solid rgba(74,103,159,.3);white-space:nowrap}.tabs a.active{background:linear-gradient(180deg,rgba(139,77,255,.72),rgba(73,31,161,.4));color:#fff}.metrics{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:12px;margin-bottom:14px}.metric{position:relative;overflow:hidden;padding:15px;min-height:112px}.metric:before{content:"";position:absolute;right:-34px;top:-34px;width:96px;height:96px;border-radius:50%;background:var(--tone,var(--blue));opacity:.22}.metric .label{color:#a9bad7;font-size:13px}.metric .value{font-size:25px;font-weight:850;margin:8px 0 6px}.metric svg{position:absolute;right:10px;bottom:8px;width:78px;height:36px;opacity:.9}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.panel{padding:16px;min-width:0;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.panel-head a,.link{color:#bd83ff;text-decoration:none}.table{width:100%;border-collapse:collapse;overflow:hidden}.table th,.table td{padding:11px 10px;border-bottom:1px solid rgba(74,103,159,.28);text-align:left;white-space:nowrap}.table th{color:#8da2c2;font-size:12px}.tag{display:inline-flex;border:1px solid currentColor;border-radius:6px;padding:3px 8px;font-size:12px}.green{color:var(--green)}.blue{color:var(--blue)}.purple{color:var(--purple)}.orange{color:var(--orange)}.red{color:var(--red)}.yellow{color:var(--yellow)}.chart-center{display:grid;place-items:center;min-height:232px}.donut-wrap{display:grid;grid-template-columns:230px 1fr;gap:15px;align-items:center}.bar{height:9px;background:#13223c;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:999px}.route-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}.route-card{padding:14px;text-decoration:none;color:var(--txt);min-height:102px}.route-card strong{display:block;margin-bottom:6px}.route-card small{color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid rgba(139,77,255,.75);background:linear-gradient(180deg,rgba(139,77,255,.45),rgba(42,17,92,.55));color:white;padding:10px 13px;border-radius:9px;text-decoration:none;cursor:pointer}.heat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.heat div{padding:16px;border-radius:12px;border:1px solid rgba(74,103,159,.35);background:rgba(8,18,35,.7);text-align:center}.footer-note{color:#93a7c8;border:1px solid rgba(74,103,159,.32);background:rgba(8,18,35,.65);border-radius:10px;padding:12px}@media(max-width:1250px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.metrics{grid-template-columns:repeat(2,1fr)}.grid,.grid3,.donut-wrap{grid-template-columns:1fr}.route-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.main{padding:14px}.metrics,.route-grid{grid-template-columns:1fr}.top{display:block}.wallet{justify-content:flex-start;margin-top:12px}}

function svgIcon(name,color='currentColor'){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3.1 8.6-7 10-3.9-1.4-7-5-7-10V6l7-3z" stroke="${color}" stroke-width="1.8"/><path d="M8 12h2.4l1.2-3.4 2.2 6 1.4-3.4H18" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></svg>`}
function spark(c){let pts=[2,25,12,24,22,27,32,20,42,23,52,15,62,18,72,10,82,12,92,4].map((v,i,a)=>i%2? v:null).filter(v=>v!==null);return `<svg class="spark" viewBox="0 0 100 32"><polyline points="2,25 12,24 22,27 32,20 42,23 52,15 62,18 72,10 82,12 92,4" fill="none" stroke="${c}" stroke-width="2"/><circle cx="92" cy="4" r="2.5" fill="${c}"/></svg>`}
function donut(items){let total=items.reduce((a,b)=>a+b[1],0),cur=0,stops=[];items.forEach(([c,v])=>{let n=cur+v/total*100;stops.push(`${c} ${cur}% ${n}%`);cur=n});return `<div style="width:210px;height:210px;border-radius:50%;background:conic-gradient(${stops.join(',')});display:grid;place-items:center;box-shadow:0 0 38px rgba(22,136,255,.22)"><div style="width:118px;height:118px;border-radius:50%;display:grid;place-items:center;text-align:center;background:#081223;border:1px solid #24385f"><b style="font-size:24px">AutoDeFi</b><small class="muted">Risk</small></div></div>`}
function bars(list){return list.map(([l,v,c])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${l}</span><b>${v}%</b></div><div class="bar"><span style="width:${v}%;background:${c}"></span></div></div>`).join('')}
function table(rows,title){let heads=rows[0]?.length===8?['Loan ID','Borrower/Asset','Collateral','Amount/Status','LTV','Health','Risk','State']:rows[0]?.length===5?['Name','Description','Severity','Impact','Status']:rows[0]?.length===4?['Item','Value','Metric','Status']:['Item','Value','Status'];return `<div class="panel"><div class="panel-head"><h2>${title}</h2><a href="#/loan-detail">View details →</a></div><div style="overflow:auto"><table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${tagify(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function tagify(x){let s=String(x),c=s.match(/Critical|Default|Rejected|High|Missed|At Risk/)?'red':s.match(/Warning|Watch|Medium|Pending|Moderate|Late|Elevated/)?'orange':s.match(/Low|Active|Healthy|Complete|Completed|Resolved|Optimal|Ready|Strong|Excellent|Resilient|Sufficient/)?'green':s.match(/Tier 1|Tier 2|Info|PDF|XLSX/)?'blue':'';return c?`<span class="tag ${c}">${s}</span>`:s}
function render(){let key=location.hash.replace('#/','')||'risk-overview',p=routes[key]||routes['risk-overview'];document.title=`AutoDeFi DAO | ${p.title}`;document.getElementById('app').innerHTML=`<aside class="side"><div class="brand"><svg class="logo" viewBox="0 0 64 46"><path d="M3 42L22 4h14l19 38H42l-5-11H25l-5 11H3z" fill="url(#g)"/><path d="M26 21h8l-4-9-4 9z" fill="#050814"/><defs><linearGradient id="g"><stop stop-color="#1688ff"/><stop offset="1" stop-color="#8b4dff"/></linearGradient></defs></svg><div><b>AUTO<span>DEFI</span> <small>DAO</small></b></div></div><div class="health"><div class="health-row">${svgIcon('shield','var(--green)')}<div><h3>Protocol Health</h3><div class="green">Excellent</div><small>Risk Score</small><div class="score">18 / 100</div><small class="green">Low Risk</small></div></div>${spark('var(--green)')}</div><nav class="nav">${nav.map(n=>`<a class="${n==='Risk Management'?'active':''}" href="#/risk-overview">${svgIcon('n')} ${n}${n==='Risk Management'?'<span class="tag purple">New</span>':''}</a>`).join('')}</nav><div class="side-card"><small>Active Loans</small><div class="big">11,293</div><small class="green">+15.8% vs last 30d</small>${spark('var(--green)')}</div><div class="side-card"><small>Total Value at Risk</small><div class="big">$2,145,873</div><small class="green">1.87% of total lending</small><div class="bar"><span style="width:47%"></span></div></div><div class="side-card"><small>Last Risk Assessment</small><p>May 12, 2025 10:30 AM EST</p><small class="green">All systems operational</small><a class="btn" href="#/risk-assessment-run" style="display:block;text-align:center;margin-top:12px">Run Risk Assessment</a></div></aside><main class="main"><header class="top"><div class="title"><h1>🛡️ Risk Management</h1><p>${p.sub}</p></div><div class="wallet"><span class="pill">ADF $0.8724 <b class="gain">+4.32%</b></span><span class="pill">🔔 12</span><span class="pill">0x7a8B...EF23<br><small>DAO Governor</small></span></div></header><div class="tabs">${tabs.map(t=>`<a class="${p.tab===t?'active':''}" href="#/${tabRoute(t)}">${t}</a>`).join('')}</div><section class="metrics">${p.metrics.map(m=>`<div class="metric" style="--tone:var(--${m[3]})"><div class="label">${m[0]}</div><div class="value">${m[1]}</div><small>${m[2]}</small>${spark(`var(--${m[3]})`)}</div>`).join('')}</section><section class="grid"><div>${table(p.rows,p.table)}<div class="grid3"><div class="panel"><h3>Trend / Performance</h3><svg viewBox="0 0 520 210" width="100%" height="210"><path d="M30 170 C80 110 120 135 160 90 S250 140 300 80 410 110 490 42" fill="none" stroke="var(--blue)" stroke-width="3"/><path d="M30 180 C90 160 130 165 180 145 S250 170 310 132 420 120 490 96" fill="none" stroke="var(--green)" stroke-width="3"/><g stroke="#263d65">${[50,90,130,170].map(y=>`<line x1="25" y1="${y}" x2="500" y2="${y}"/>`).join('')}</g></svg></div><div class="panel"><h3>Distribution</h3><div class="chart-center">${donut([['var(--green)',38],['var(--blue)',26],['var(--orange)',21],['var(--red)',15]])}</div></div><div class="panel"><h3>Key Ratios</h3>${bars([['Coverage',92,'var(--green)'],['Liquidity',78,'var(--blue)'],['Intervention',46,'var(--orange)'],['Critical',12,'var(--red)']])}</div></div></div><aside><div class="panel"><div class="panel-head"><h2>${p.right}</h2><a href="#/alerts">View all →</a></div>${p.alerts.map(a=>`<div class="pill" style="display:flex;justify-content:space-between;margin-bottom:9px;width:100%"><span>${a}</span><a class="link" href="#/loan-detail">Review</a></div>`).join('')}</div><div class="panel"><h3>Collateral Risk Heatmap</h3><div class="heat"><div class="red">Crypto<br><b>8.2%</b></div><div class="orange">Exotic Cars<br><b>6.5%</b></div><div class="yellow">Classic Cars<br><b>7.1%</b></div><div class="orange">Luxury SUVs<br><b>22.4%</b></div><div class="orange">Luxury Sedans<br><b>28.7%</b></div><div class="yellow">Commercial<br><b>9.3%</b></div><div class="green">Stablecoins<br><b>11.2%</b></div><div class="green">Real Estate<br><b>6.6%</b></div><div class="green">Cash Equiv.<br><b>0.3%</b></div></div><p><a class="link" href="#/collateral-heatmap">View full heatmap →</a></p></div></aside></section><div class="panel"><div class="panel-head"><h2>Completed Risk Management Screens #1–#14 + Internal Links</h2><a class="btn" href="#/risk-reports">Risk Reports</a></div><div class="route-grid">${Object.entries(routes).map(([k,v])=>`<a class="route-card" href="#/${k}"><strong>${v.title}</strong><small>${v.sub.slice(0,82)}...</small></a>`).join('')}</div></div><div class="footer-note">AutoDeFi alignment: dealer deals funded in full after approval/delivery, borrower repayments use regional stable-value rails, interest yield routes to stakers in matching risk-tier pools, and ADF remains the staking/collateral/access/rewards/governance utility token.</div></main>`}
function tabRoute(t){return {'Risk Overview':'risk-overview','Loan Monitoring':'loan-monitoring-live','Stress Testing':'stress-testing-scenarios','Risk Parameters':'risk-parameters-core','Liquidation Settings':'liquidation-engine','Insurance Coverage':'insurance-coverage-programs','Historical Risk':'historical-risk','Risk Reports':'risk-reports'}[t]}
addEventListener('hashchange',render);render();
</script>
