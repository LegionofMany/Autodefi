services:
  postgres:
    image: postgres:16-alpine
    container_name: autodefi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autodefi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    container_name: autodefi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
