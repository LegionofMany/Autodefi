    <path d="M178 43c47-30 107-28 158-8 28 11 52 27 77 45H144c9-15 20-27 34-37Z" fill="#081529" stroke="#22d3ee" stroke-opacity=".55"/>
    <path d="M310 40 344 84M218 43l-24 40" stroke="#1677ff" opacity=".55"/>
    <path d="M78 112h135c34 0 48 13 68 26H62c2-10 7-19 16-26Z" fill="#0b1220" opacity=".9"/>
    <path d="M404 116h98c14 3 24 10 31 22H387c4-10 9-17 17-22Z" fill="#0b1220" opacity=".9"/>
    <circle cx="164" cy="147" r="34" fill="#020617" stroke="#1677ff" stroke-width="4"/>
