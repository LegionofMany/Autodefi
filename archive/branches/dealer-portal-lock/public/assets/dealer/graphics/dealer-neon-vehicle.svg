<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">AutoDeFi neon vehicle hero graphic</title>
  <desc id="desc">Low dark sports car with electric blue light trails for AutoDeFi Protect banner.</desc>
  <defs>
    <linearGradient id="car" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="0.45" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#20c8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#20c8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="220" fill="transparent"/>
