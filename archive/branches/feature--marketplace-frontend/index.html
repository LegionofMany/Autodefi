<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoDeFi DAO Treasury Management Center</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#030814;color:#eaf2ff;font-family:Inter,Arial,sans-serif}.app{display:flex;min-height:100vh;background:radial-gradient(circle at top right,#122145,#030814 40%,#01040a)}.sidebar{width:285px;background:linear-gradient(180deg,#06172b,#020712);border-right:1px solid #16304e;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:25px}.logo{width:50px;height:50px;border-radius:50%;border:2px solid #3b82f6;display:grid;place-items:center;color:#9b5cff;font-size:26px;background:#0d1730}.brand b{font-size:22px}.brand span{color:#18c8ff}.brand small{display:block;color:#aebbd0;margin-top:3px;letter-spacing:.08em}.group{margin:20px 0}.group p{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#8da1b8}.group button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#dce7f7;padding:10px 12px;border-radius:9px;text-align:left;cursor:pointer}.group button.active,.group button:hover{background:linear-gradient(90deg,#4c1d95,#25145c);color:white}.wallet{margin-top:24px;background:#06182b;border:1px solid #143758;border-radius:14px;padding:14px}.wallet em{display:block;color:#22e080;font-style:normal;margin-top:4px}.wallet button,.primary{width:100%;border:0;border-radius:9px;padding:12px;background:linear-gradient(90deg,#4c1d95,#7c3aed);color:white;margin-top:12px;cursor:pointer}.main{flex:1;padding:24px;overflow:hidden}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.top h1{margin:0;font-size:30px}.top p{margin:6px 0;color:#c6d0e0}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions button,.toolbar button,.ghost{background:#061426;border:1px solid #193657;color:#eaf2ff;border-radius:9px;padding:10px 14px}.kpis{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:14px;margin-bottom:16px}.kpi,.card{background:linear-gradient(180deg,rgba(8,27,49,.95),rgba(4,15,29,.95));border:1px solid #143758;border-radius:14px;box-shadow:0 18px 55px rgba(0,0,0,.25)}.kpi{padding:17px}.kpi small{color:#aebbd0}.kpi strong{display:block;font-size:24px;margin:6px 0}.good{color:#20e483}.bad{color:#ff5168}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{padding:18px;margin-bottom:16px}.card h3{margin:0 0 14px}.donut{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}.circle{width:170px;height:170px;border-radius:50%;background:conic-gradient(#3b82f6 0 42%,#7c3aed 42% 64%,#14b8a6 64% 78%,#f59e0b 78% 90%,#ef4444 90% 96%,#64748b 96% 100%);display:grid;place-items:center}.circle div{width:92px;height:92px;border-radius:50%;background:#061426;display:grid;place-items:center;text-align:center}.circle b{font-size:20px}.legend p{display:grid;grid-template-columns:1fr auto;gap:10px;margin:9px 0;color:#cbd5e1}.bars p{display:grid;grid-template-columns:1fr auto auto;gap:12px;position:relative;margin:14px 0 20px}.bars i{position:absolute;left:0;right:30%;bottom:-8px;height:6px;border-radius:20px;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}.health p{display:grid;grid-template-columns:1fr auto auto;gap:12px;border:1px solid #18385b;border-radius:9px;padding:11px;margin:8px 0}.tag{padding:4px 9px;border-radius:7px;background:#052d1d;border:1px solid #0d854b;color:#20e483}.warn{background:#2d2104;border-color:#854d0e;color:#fbbf24}.redtag{background:#36080f;border-color:#7f1d1d;color:#ff6372}.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.toolbar input,.form input,.form select,.form textarea{background:#061426;border:1px solid #193657;border-radius:9px;padding:11px;color:#eaf2ff}.toolbar input{min-width:280px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #143758;padding:12px;white-space:nowrap}th{font-size:12px;color:#9fb2c8}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.steps span{padding:14px;border:1px solid #18385b;border-radius:10px;background:#061426;color:#cbd5e1}.steps .active{background:linear-gradient(90deg,#4c1d95,#101b38)}.form{display:grid;gap:10px}.form label{font-size:13px;color:#b6c4d7}.tabs{display:flex;gap:10px;border-bottom:1px solid #18385b;margin-bottom:16px;overflow:auto}.tabs button{background:transparent;border:0;color:#dce7f7;padding:13px 9px;cursor:pointer}.tabs .active{color:#c084fc;border-bottom:2px solid #a855f7}.bottom{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.spark{height:8px;background:linear-gradient(90deg,#22c55e,#2563eb);border-radius:20px;margin-top:14px}.note{border:1px solid #143758;background:#061426;border-radius:12px;padding:14px;color:#bfd0e6}.hidden{display:none}@media(max-width:1300px){.kpis,.bottom{grid-template-columns:repeat(3,1fr)}.grid,.grid2{grid-template-columns:1fr}.sidebar{width:240px}.top{flex-direction:column}}@media(max-width:760px){.app{display:block}.sidebar{width:100%;height:auto;position:relative}.kpis,.bottom{grid-template-columns:1fr}.main{padding:14px}.donut{grid-template-columns:1fr}.actions{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">A</div><div><b>AUTO<span>DEFI</span> DAO</b><small>TREASURY PORTAL</small></div></div>
    <div id="nav"></div>
    <div class="wallet"><b>AutoDeFi Treasury Wallet</b><small>0x3c4E...a218f</small><em>Connected</em><p>Multi-Sig: 5 of 9</p><button>View Wallet</button></div>
  </aside>
  <main class="main">
    <header class="top"><div><h1 id="title">Treasury Management Center</h1><p id="subtitle">Oversee and optimize AutoDeFi treasury operations.</p></div><div class="actions"><button>May 12, 2025</button><button>Export</button><button>Treasury Admin · Verified</button></div></header>
    <section id="content"></section>
  </main>
</div>
<script>
const groups={"TREASURY OPERATIONS":["Dashboard","Treasury Assets","Allocations","Revenue Streams","Reserves","Expenditures","Budgeting","Reports","Audit Logs"],"TREASURY ACTIONS":["Transfer Funds","Swap / Convert","Stake Assets","Approve Spending","Treasury Proposals"],"ANALYTICS":["Performance","Cash Flow","Scenario Planning","Stress Testing"],"CONFIGURATION":["Policies & Rules","Multi-Sig Wallets","Integrations","Settings"]};
const kpis=[['Total Treasury Balance','$24.67M','↑ 13.3% vs last 30d','good'],['Stablecoins','$18.42M','↑ 7.2% vs last 30d','good'],['Token Holdings (ADF)','$4.12M','↑ 16.7% vs last 30d','good'],['Other Assets','$2.13M','↑ 18.8% vs last 30d','good'],['Monthly Revenue','$1.24M','↑ 12.3% vs last 30d','good'],['Monthly Expenses','$432.11K','↓ 4.3% vs last 30d','bad']];
const allocations=[['Lending Reserves','45.2%','$11.14M'],['Insurance Reserve','22.2%','$5.48M'],['Operations','12.6%','$3.11M'],['Growth & Development','10.4%','$2.56M'],['Marketing','5.1%','$1.26M'],['Liquidity','3.9%','$962.5K']];
const assets=[['USDC','Stablecoin','Hedera / Ethereum','10.24M','$10.24M','41.5%','Healthy','4.25%'],['USDT','Stablecoin','Hedera','4.56M','$4.56M','18.5%','Healthy','4.12%'],['ADF','Governance Token','Hedera','12.35M','$4.12M','16.7%','Healthy','—'],['DAI','Stablecoin','Ethereum','2.12M','$2.12M','8.6%','Healthy','3.89%'],['wETH','Liquid Staking','Ethereum','450.75','$1.52M','6.2%','Healthy','3.42%'],['stETH','Liquid Staking','Ethereum','280.50','$957.8K','3.9%','Healthy','3.35%']];
const tx=[['Revenue','Interest Income - Auto Loans','+$482,190','USDC','May 12, 2025'],['Expense','Development Payroll','-$125,400','USDC','May 12, 2025'],['Revenue','Insurance Premiums','+$112,340','USDC','May 11, 2025'],['Transfer','To Insurance Reserve','-$500,000','USDC','May 10, 2025']];
const revenue=[['Lending Interest','Interest Income','Multi','$482,190','38.8%','Active'],['Borrowing Fees','Fee Income','Multi','$223,670','18.0%','Active'],['Liquidation Fees','ZONYCS Recovery','Multi','$172,452','13.9%','Active'],['Stablecoin Fees','Fee Income','Multi','$138,288','11.1%','Active'],['Yield Strategy Returns','Investment Income','Multi','$105,858','8.5%','Active'],['Swap Fees','Trading Fees','Multi','$66,315','5.3%','Active']];
const budgets=[['Operations','$1,200,000','$782,450','$417,550','65.2%','On Track'],['Development','$1,500,000','$892,310','$607,690','59.5%','On Track'],['Marketing','$600,000','$321,870','$278,130','53.6%','On Track'],['Liquidity','$800,000','$512,230','$287,770','64.0%','On Track'],['Community','$400,000','$208,430','$191,570','52.1%','On Track'],['Security','$200,000','$156,210','$43,790','78.1%','Attention']];
const proposals=[['PROP-2025-021','Q2 Marketing Campaign Budget Increase','Marketing','Marketing Lead','250,000 USDC','Active'],['PROP-2025-020','Developer Grants Round 6','Grants','Dev Relations','750,000 USDC','Active'],['PROP-2025-019','Liquidity Incentives for USDC/WETH','Liquidity','Treasury Ops','1,000,000 USDC','Active'],['PROP-2025-018','Security Audit — Core Contracts','Security','Security Lead','150,000 USDC','Active'],['PROP-2025-017','Community Event Sponsorship','Community','Community Lead','75,000 USDC','Passed'],['PROP-2025-016','Treasury Diversification Strategy','Investments','Investment Lead','2,000,000 USDC','Executed']];
let active='Dashboard';
function nav(){document.getElementById('nav').innerHTML=Object.entries(groups).map(([g,items])=>`<div class="group"><p>${g}</p>${items.map(x=>`<button class="${active===x?'active':''}" onclick="openTab('${x}')">${x}</button>`).join('')}</div>`).join('')}
function K(){return `<div class="kpis">${kpis.map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]}</strong><em class="${x[3]}">${x[2]}</em></div>`).join('')}</div>`}
function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}
function donut(center='$24.67M',label='Total Treasury'){return `<div class="donut"><div class="circle"><div><b>${center}</b><small>${label}</small></div></div><div class="legend">${allocations.map(a=>`<p><span>${a[0]}</span><b>${a[1]}</b><small>${a[2]}</small></p>`).join('')}</div></div>`}
function bars(rows){return `<div class="bars">${rows.map((r,i)=>`<p><span>${r[0]}</span><b>${r[1]}</b><small>${r[2]||''}</small><i style="right:${20+i*7}%"></i></p>`).join('')}</div>`}
function health(){return `<div class="health"><p>Lending Reserve Ratio <b>18.6%</b><em>Healthy</em></p><p>Insurance Reserve Ratio <b>182.6%</b><em>Strong</em></p><p>Liquidity Ratio <b>24.3%</b><em>Strong</em></p><p>Operational Runway <b>18.2 Months</b><em>Healthy</em></p></div>`}
function table(h,rows){return `<div class="table"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td class="${String(c).startsWith('-')||String(c).includes('Failed')||String(c).includes('Attention')?'bad':String(c).startsWith('+')||String(c).includes('Healthy')||String(c).includes('Active')||String(c).includes('Success')||String(c).includes('On Track')?'good':''}">${c}</td>`).join('')}<td><button class="ghost">View</button></td></tr>`).join('')}</tbody></table></div>`}
function toolbar(p='Search...'){return `<div class="toolbar"><input placeholder="${p}"><button>All Categories</button><button>All Statuses</button><button>Filters</button></div>`}
function dashboard(){return K()+`<div class="grid">${card('Treasury Allocation',donut())}${card('Revenue Streams (30D)',bars(revenue.slice(0,5).map(r=>[r[0],r[3],r[4]])))}${card('Reserve Health',health())}</div><div class="grid">${card('AutoDeFi Loan Pool Overview',donut('$11.14M','Total Loan Pool')+'<div class="bottom"><div><b>356</b><small> Active Loans</small></div><div><b>12.7%</b><small> Avg APR</small></div><div><b>58.3%</b><small> LTV</small></div></div>')}${card('Recent Transactions',table(['Type','Description','Amount','Asset','Date'],tx))}${card('Treasury Balance History','<div class="spark"></div><p>Treasury has grown from $15M to $24.67M across lending yield, stablecoin fees, ADF holdings, and recovery revenue.</p>')}</div><div class="bottom">${['Net Cash Flow $811.23K','ROI 5.72%','DAO Efficiency 87/100','Risk Exposure Low','Treasury Utilization 68.4%','Policy Compliance 98.6%'].map(x=>`<div class="kpi"><strong>${x}</strong><div class="spark"></div></div>`).join('')}</div>`}
function generic(name){let rows=tx,heads=['Type','Description','Amount','Asset','Date'];let title=name;if(name==='Treasury Assets'){rows=assets;heads=['Asset','Type','Network','Quantity','USD Value','% Total','Status','Yield/APY']}if(name==='Revenue Streams'){rows=revenue;heads=['Source','Category','Network','Revenue','% Total','Status']}if(name==='Budgeting'||name==='Expenditures'){rows=budgets;heads=['Category','Budget','Spent','Remaining','Utilization','Status']}if(name==='Reports'){rows=[['Treasury Overview Report','Overview','May 12, 2025','PDF'],['Financial Summary','Summary','May 12, 2025','Excel'],['Cash Flow Analysis','Cash Flow','May 11, 2025','PDF'],['Revenue Streams Report','Revenue','May 11, 2025','Excel']];heads=['Report Name','Type','Generated','Format']}if(name==='Audit Logs'){rows=[['May 12, 2025 11:28 AM','Transfer','Transferred 250,000 USDC','Treasury Admin','Success'],['May 12, 2025 11:20 AM','Swap / Convert','Swapped 100 ETH to USDC','Ops Multisig','Success'],['May 12, 2025 10:45 AM','Transfer','Transfer failed: insufficient balance','Finance Bot','Failed']];heads=['Time','Activity','Description','User','Status']}return K()+`<div class="grid">${card(`${title} Overview`,donut())}${card(`${title} Performance`,'<div class="spark"></div><p>30 day trend is positive and aligned to AutoDeFi loan-pool treasury controls.</p>')}${card(`${title} Health`,health())}</div><div class="grid2">${card(`${title} Details`,toolbar('Search '+title.toLowerCase()+'...')+table(heads,rows))}${card('Quick Insights',bars([['Loan interest yield','$482.19K','67.9%'],['Insurance fees','$122.36K','17.2%'],['Origination fees','$112.35K','8.1%'],['ZONYCS recovery fees','$54.35K','4.3%']]))}</div>`}
function action(name){return `<div class="steps"><span class="active">1 Enter Details</span><span>2 Review & Confirm</span><span>3 Multi-Sig Authorize</span><span>4 Complete</span></div><div class="grid2">${card(name+' Form',`<div class="form"><label>Source Wallet</label><select><option>AutoDeFi Treasury Wallet</option></select><label>Asset</label><select><option>USDC</option><option>ADF</option><option>HBAR</option><option>ETH</option></select><label>Amount</label><input value="1,000,000"><label>Purpose</label><select><option>Operations - General Expenses</option><option>Insurance Reserve</option><option>Lending Pool Liquidity</option><option>ZONYCS Recovery Allocation</option></select><label>Memo</label><textarea>AutoDeFi DAO treasury action</textarea><button class="primary">Review ${name}</button></div>`)}${card(name+' Summary',health()+bars([['Daily Limit','$5.00M','20%'],['This Transaction','$1.00M','50%'],['Required Signers','5 of 9','Ready']]))}</div>${card('Recent '+name+' Activity',table(['Type','Description','Amount','Asset','Date'],tx))}`}
function proposalsPage(){return K()+`<div class="grid2">${card('Treasury Proposals',toolbar('Search proposals...')+table(['Proposal ID','Title','Category','Proposer','Amount','Status'],proposals))}${card('Proposal Activity',donut('78','Total Proposals')+bars([['Active','9','28.6%'],['Passed','52','15.2%'],['Executed','47','18.3%'],['Defeated','7','-12.5%']]))}</div>${card('How The Process Works','<div class="steps"><span>1 Create Proposal</span><span>2 Community Review</span><span>3 Voting Period</span><span>4 Multi-Sig Execution</span></div><p>All proposals require community approval through on-chain voting. Quorum and approval thresholds are defined in DAO governance policy.</p>')}`}
function analytics(name){return K()+`<div class="grid">${card(name+' Value Over Time','<div class="spark"></div><p>$24.67M treasury value with +18.62% growth over the period.</p>')}${card('Asset Allocation Over Time',donut())}${card('Risk / Return Metrics',health())}</div><div class="grid2">${card(name+' Scenario Table',table(['Metric','30D','90D','YTD','1Y'],[['Total Return','12.34%','22.81%','45.62%','78.21%'],['Volatility','6.28%','7.14%','8.62%','9.35%'],['Max Drawdown','-4.12%','-5.31%','-6.87%','-9.23%']]))}${card('AI Insight','<p>AutoDeFi treasury performance is driven by borrower interest repayments, stable-value rails, staking rewards, and ZONYCS recovery fees. Current reserves remain healthy under the selected stress profile.</p>')}</div>`}
function config(name){let rows=[['Spending Approval Policy','Approvals','All Assets','Active','May 5, 2025'],['Transfer Limit Policy','Limits','Transfers','Active','May 2, 2025'],['Stablecoin Exposure Policy','Risk','Stablecoins','Active','Apr 25, 2025'],['DeFi Protocol Allowlist','Access','DeFi Actions','Active','Apr 22, 2025'],['Treasury Proposal Threshold','Governance','Proposals','Active','Apr 20, 2025']];if(name==='Multi-Sig Wallets')rows=[['Main Treasury','Ethereum','5 of 9','$18.72M','Active'],['DeFi Operations','Arbitrum','4 of 7','$6.45M','Active'],['Staking Rewards','Hedera','3 of 5','$3.21M','Active'],['DAO Grants','Polygon','3 of 6','$1.83M','Active']];if(name==='Integrations')rows=[['HashScan / Hedera Mirror Node','Data & Oracle','Active','Price Feeds','1m ago'],['Chainlink','Data & Oracle','Active','Price Feeds','1m ago'],['Fireblocks','Infrastructure','Active','Wallet Management','5m ago'],['Snapshot','Governance','Active','Proposal Sync','6m ago'],['OpenZeppelin Defender','Security','Active','Admin Control','4m ago']];return `<div class="tabs"><button class="active">Overview</button><button>Security</button><button>Workflow</button><button>Automation</button></div><div class="grid2">${card(name,toolbar('Search '+name.toLowerCase()+'...')+table(['Name','Category / Network','Scope / Status','Permissions / Signers','Last Update / Value'],rows))}${card(name+' Summary',donut(name==='Multi-Sig Wallets'?'8':'24','Total')+health())}</div>`}
function settings(){return `<div class="tabs"><button class="active">General</button><button>Security</button><button>Notifications</button><button>Access & Roles</button><button>API Keys</button><button>Audit & Logs</button><button>System</button></div><div class="grid">${card('Organization Settings','<div class="form"><label>Organization Name</label><input value="AutoDeFi DAO"><label>Currency</label><input value="USD"><label>Default Network</label><input value="Hedera"><button class="primary">Save Changes</button></div>')}${card('Financial Settings','<div class="form"><label>Price Source</label><input value="HashScan / Chainlink"><label>Slippage Tolerance</label><input value="0.50%"><label>Transaction Gas Limit</label><input value="500,000"><button class="primary">Save Settings</button></div>')}${card('Security Summary',health())}</div>`}
function openTab(x){active=x;nav();document.getElementById('title').textContent=x==='Dashboard'?'Treasury Management Center':x;document.getElementById('subtitle').textContent=x==='Dashboard'?'Oversee and optimize AutoDeFi treasury operations.':'AutoDeFi DAO Treasury Portal aligned to the decentralized auto loan pool structure.';let html=x==='Dashboard'?dashboard():['Transfer Funds','Swap / Convert','Stake Assets','Approve Spending'].includes(x)?action(x):x==='Treasury Proposals'?proposalsPage():['Performance','Cash Flow','Scenario Planning','Stress Testing'].includes(x)?analytics(x):['Policies & Rules','Multi-Sig Wallets','Integrations'].includes(x)?config(x):x==='Settings'?settings():generic(x);document.getElementById('content').innerHTML=html}
nav();openTab('Dashboard');
</script>
</body>
</html>
