  <rect x="470" y="124" width="820" height="540" class="panel"/><text x="512" y="168" class="text h2">7. VEHICLE AUDIT</text><text x="512" y="202" class="muted body">VIN verification, market value, history, condition, and asset quality review</text>
  <rect x="512" y="244" width="350" height="150" class="panel2"/><text x="540" y="286" class="muted small">Approved Value</text><text x="540" y="342" class="green num">$32.45k</text>
  <rect x="890" y="244" width="170" height="150" class="panel2"/><text x="912" y="286" class="muted small">LTV</text><text x="975" y="342" class="green num" text-anchor="middle">87.7</text>
  <rect x="1088" y="244" width="170" height="150" class="panel2"/><text x="1110" y="286" class="muted small">Stable</text><text x="1173" y="342" class="green num" text-anchor="middle">89%</text>
  <rect x="512" y="428" width="746" height="184" class="panel2"/><text x="540" y="470" class="text body">Vehicle Verification Signals</text><text x="540" y="520" class="muted small">VIN + History</text><text x="1228" y="520" class="green small" text-anchor="end">Verified</text><text x="540" y="568" class="muted small">Recovery Profile</text><text x="1228" y="568" class="green small" text-anchor="end">Strong</text>
  <rect x="1316" y="124" width="450" height="540" class="panel"/><text x="1350" y="168" class="text h2">Vehicle Results</text><path d="M1410 360 A150 150 0 1 1 1670 360" fill="none" stroke="#10233c" stroke-width="34"/><path d="M1410 360 A150 150 0 0 1 1624 250" fill="none" stroke="url(#ring)" stroke-width="34"/><text x="1540" y="340" class="text num" text-anchor="middle">89%</text><text x="1540" y="382" class="text body" text-anchor="middle">Value Stability</text><text x="1350" y="472" class="muted small">Decision Impact</text><text x="1710" y="472" class="green small" text-anchor="end">+7%</text><text x="1350" y="520" class="muted small">Risk Adjustment</text><text x="1710" y="520" class="green small" text-anchor="end">-4%</text><text x="1350" y="568" class="muted small">V2 Shadow</text><text x="1710" y="568" class="yellow small" text-anchor="end">Recovery Learning</text>
  <rect x="26" y="690" width="1740" height="250" class="panel"/><text x="58" y="736" class="text h2">Vehicle + Reason-Code Breakdown</text><text x="58" y="812" class="green body">VIN Verified · Market Value Confirmed · LTV Acceptable · History Clean · Mileage Acceptable · Title Clean</text>
</svg>
