  <g transform="translate(1088 244)"><rect width="170" height="150" class="panel-soft"/><text x="22" y="42" class="muted small">HTI</text><text x="85" y="100" class="green num" text-anchor="middle">27.7</text><text x="85" y="132" class="green tiny" text-anchor="middle">Percent</text></g>
  <rect x="512" y="428" width="746" height="184" class="panel-soft"/><text x="540" y="470" class="text body">Residence Verification Signals</text><text x="540" y="520" class="muted small">Address Match</text><text x="1228" y="520" class="green small" text-anchor="end">Verified</text><text x="540" y="568" class="muted small">Move Frequency</text><text x="1228" y="568" class="green small" text-anchor="end">Low</text>

  <rect x="1316" y="124" width="450" height="540" class="panel"/><text x="1350" y="168" class="text h2">Residence Results</text><path d="M1410 360 A150 150 0 1 1 1670 360" fill="none" stroke="#10233c" stroke-width="34"/><path d="M1410 360 A150 150 0 0 1 1610 252" fill="none" stroke="url(#home)" stroke-width="34" filter="url(#glow)"/><text x="1540" y="340" class="text num" text-anchor="middle">84%</text><text x="1540" y="382" class="text body" text-anchor="middle">Stability</text>
  <g transform="translate(1350 438)"><text y="0" class="muted small">Decision Impact</text><text x="360" y="0" class="green small" text-anchor="end">+8%</text><text y="48" class="muted small">Risk Adjustment</text><text x="360" y="48" class="green small" text-anchor="end">-5%</text><text y="96" class="muted small">Residence Type</text><text x="360" y="96" class="cyan small" text-anchor="end">Rented</text><text y="144" class="muted small">Housing Cost</text><text x="360" y="144" class="green small" text-anchor="end">$1,280</text></g>

  <rect x="26" y="690" width="1740" height="250" class="panel"/><text x="58" y="736" class="text h2">Residence + Reason-Code Breakdown</text>
  <g transform="translate(58 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">Address</text><text x="28" y="82" class="green small">Verified</text></g>
  <g transform="translate(332 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">Tenure</text><text x="28" y="82" class="green small">Stable</text></g>
  <g transform="translate(606 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">Moves</text><text x="28" y="82" class="green small">Low</text></g>
  <g transform="translate(880 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">Housing</text><text x="28" y="82" class="green small">Acceptable</text></g>
  <g transform="translate(1154 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">V1</text><text x="28" y="82" class="cyan small">Stability</text></g>
  <g transform="translate(1428 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">V2 Shadow</text><text x="28" y="82" class="yellow small">Delinquency Learning</text></g>
