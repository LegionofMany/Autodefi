  <rect x="470" y="124" width="820" height="540" class="panel"/><text x="512" y="168" class="text h2">4. RESIDENCE AUDIT</text><text x="512" y="202" class="muted body">Address verification, housing stability, move frequency, and payment capacity review</text>
  <g transform="translate(512 244)"><rect width="350" height="150" class="panel-soft"/><text x="28" y="42" class="muted small">Current Address</text><text x="28" y="92" class="green body" font-weight="800">Verified Primary</text><text x="28" y="128" class="cyan tiny">KYC + bureau aligned</text></g>
