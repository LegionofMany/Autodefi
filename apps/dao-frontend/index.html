function heat(){return `<div class="heat">${Array.from({length:112}).map((_,i)=>`<i style="--a:${.12+(i%9)/11}"></i>`).join('')}</div>`}
function settings(){return `<div class="settings">${['Show Voting Power','Email Digest','Auto-claim Rewards','Proposal Notifications','Forum Activity','Data Sharing'].map((x,i)=>`<div class="toggle"><div><b>${x}</b><p style="margin:4px 0 0;color:var(--muted);font-size:12px">DAO preference</p></div><span class="switch"></span></div>`).join('')}</div>`}
function danger(){return `<div class="feed"><article class="danger"><span class="orb">${icon('security')}</span><div><h4>Export My Data</h4><p>Download all DAO data.</p></div><button class="ghost" style="width:auto">Export</button></article><article class="danger"><span class="orb">${icon('security')}</span><div><h4>Revoke All Sessions</h4><p>Sign out from all devices.</p></div><button class="ghost" style="width:auto">Revoke</button></article></div>`}
function actions(){return `<div class="feed">${['Transfer Funds','Swap / Convert','Stake Assets','Create Proposal','Delegate Now','Download Report'].map((x,i)=>`<article><span class="orb">${icon(['treasury','tokenomics','staking','proposals','delegation','analytics'][i])}</span><div><h4>${x}</h4><p>DAO action ready for backend connection.</p></div><span>→</span></article>`).join('')}</div>`}

async function loadBackend(slug){const base=localStorage.getItem('AUTODEFI_API_BASE_URL')||window.AUTODEFI_API_BASE_URL;if(!base)return null;try{const res=await fetch(`${base.replace(/\/$/,'')}/api/dao/pages/${slug}`);return res.ok?await res.json():null}catch{return null}}
