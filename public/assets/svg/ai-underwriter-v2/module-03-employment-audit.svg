  <rect x="470" y="124" width="820" height="540" class="panel"/><text x="512" y="168" class="text h2">3. EMPLOYMENT AUDIT</text><text x="512" y="202" class="muted body">Employer verification, tenure stability, industry risk, continuity, and repayment confidence</text>
  <g transform="translate(512 244)"><rect width="746" height="146" class="panel-soft"/><text x="28" y="44" class="muted small">Verified Employer</text><text x="28" y="96" class="green h2">Northstar Logistics Group</text><text x="28" y="128" class="muted tiny">Employer match verified · Title match verified · Full-time permanent</text></g>
  <g transform="translate(512 420)"><rect width="226" height="134" class="panel-soft"/><text x="28" y="42" class="muted small">Tenure</text><text x="28" y="92" class="green num">2.8</text><text x="115" y="92" class="green small">Years</text></g>
  <g transform="translate(772 420)"><rect width="226" height="134" class="panel-soft"/><text x="28" y="42" class="muted small">Stability Score</text><text x="28" y="92" class="green num">86%</text></g>
  <g transform="translate(1032 420)"><rect width="226" height="134" class="panel-soft"/><text x="28" y="42" class="muted small">Risk Adjustment</text><text x="28" y="92" class="green num">-8%</text></g>

  <rect x="1316" y="124" width="450" height="540" class="panel"/><text x="1350" y="168" class="text h2">Employment Results</text><path d="M1410 360 A150 150 0 1 1 1670 360" fill="none" stroke="#10233c" stroke-width="34"/><path d="M1410 360 A150 150 0 0 1 1628 248" fill="none" stroke="url(#stability)" stroke-width="34" filter="url(#glow)"/><text x="1540" y="340" class="text num" text-anchor="middle">86%</text><text x="1540" y="382" class="text body" text-anchor="middle">Stability</text>
  <g transform="translate(1350 438)"><text y="0" class="muted small">Verification</text><text x="360" y="0" class="green small" text-anchor="end">Verified</text><text y="48" class="muted small">Decision Impact</text><text x="360" y="48" class="green small" text-anchor="end">+12%</text><text y="96" class="muted small">Layoff Exposure</text><text x="360" y="96" class="green small" text-anchor="end">Low</text><text y="144" class="muted small">V2 Shadow</text><text x="360" y="144" class="yellow small" text-anchor="end">Audit Only</text></g>

  <rect x="26" y="690" width="1740" height="250" class="panel"/><text x="58" y="736" class="text h2">Employment Verification + Reason-Code Breakdown</text>
  <g transform="translate(58 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">Employer Match</text><text x="28" y="82" class="green small">Verified</text></g>
  <g transform="translate(332 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">Title Match</text><text x="28" y="82" class="green small">Verified</text></g>
  <g transform="translate(606 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">Tenure</text><text x="28" y="82" class="green small">Stable</text></g>
  <g transform="translate(880 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">Pay Continuity</text><text x="28" y="82" class="green small">Confirmed</text></g>
  <g transform="translate(1154 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">V1</text><text x="28" y="82" class="cyan small">Stability</text></g>
  <g transform="translate(1428 770)"><rect width="250" height="110" class="panel-soft"/><text x="28" y="48" class="text body">V2 Shadow</text><text x="28" y="82" class="yellow small">Outcome Learning</text></g>
</svg>
