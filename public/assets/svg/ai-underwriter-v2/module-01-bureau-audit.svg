  <circle cx="550" cy="568" r="6" fill="#00e5ff"/><circle cx="610" cy="548" r="6" fill="#00e5ff"/><circle cx="670" cy="520" r="6" fill="#00e5ff"/><circle cx="730" cy="498" r="6" fill="#00e5ff"/><circle cx="790" cy="470" r="6" fill="#00e5ff"/><circle cx="850" cy="448" r="6" fill="#00e5ff"/><circle cx="930" cy="424" r="6" fill="#39ff57"/>
