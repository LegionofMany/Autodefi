<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" role="img" aria-labelledby="title desc">
  <title id="title">AutoDeFi AI Underwriter V2 Bureau Audit</title>
  <desc id="desc">Editable dark neon AutoDeFi Bureau Audit dashboard SVG lock for AI Underwriter V2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#061426"/>
      <stop offset="1" stop-color="#02040c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.52" stop-color="#7c3cff"/>
      <stop offset="1" stop-color="#ff2f92"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1687ff"/>
      <stop offset="1" stop-color="#39ff57"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0ea5e9" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .panel{fill:#050d1c;stroke:#0ea5e9;stroke-opacity:.42;stroke-width:1.6;rx:18;filter:url(#glow)}
      .panel-soft{fill:#061426;stroke:#164e8b;stroke-opacity:.58;stroke-width:1.2;rx:16}
      .text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eef6ff}
      .muted{fill:#9eb3ca}
      .cyan{fill:#00e5ff}
      .green{fill:#39ff57}
      .purple{fill:#a855f7}
      .yellow{fill:#ffd000}
      .tiny{font-size:18px}
      .small{font-size:22px}
      .body{font-size:26px}
      .h2{font-size:38px;font-weight:800}
      .h1{font-size:48px;font-weight:900}
      .num{font-size:58px;font-weight:900}
    </style>
  </defs>

  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#grid)" opacity="0.65"/>
  <circle cx="1250" cy="130" r="420" fill="#1687ff" opacity="0.08"/>
  <circle cx="1510" cy="850" r="340" fill="#8b5cf6" opacity="0.08"/>

  <rect x="24" y="22" width="230" height="78" class="panel-soft"/>
  <path d="M78 72 L116 28 L154 72 L132 72 L116 48 L100 72 Z" fill="url(#brand)" filter="url(#glow)"/>
  <text x="170" y="63" class="text body" font-weight="800">AutoDeFi</text>

  <text x="282" y="58" class="text h1">AI Underwriter Command Center</text>
  <text x="286" y="91" class="muted body">Module 1 of 14 · Bureau Audit · V1 operating decision + V2 shadow audit</text>

  <g transform="translate(760 26)">
    <rect width="190" height="68" class="panel-soft"/>
