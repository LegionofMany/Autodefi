    <text x="85" y="88" class="text num" text-anchor="middle">722</text>
    <text x="85" y="118" class="green small" text-anchor="middle">Good</text>
  </g>
  <g transform="translate(896 238)">
    <rect width="170" height="132" class="panel-soft"/>
    <text x="22" y="38" class="purple tiny">Experian</text>
    <text x="85" y="88" class="text num" text-anchor="middle">726</text>
    <text x="85" y="118" class="green small" text-anchor="middle">Good</text>
  </g>
  <g transform="translate(1088 238)">
