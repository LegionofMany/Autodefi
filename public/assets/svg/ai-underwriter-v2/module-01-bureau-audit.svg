  <text x="178" y="220" class="text body">Applicant: <tspan class="cyan" font-weight="800">Sarah Mitchell</tspan></text>
  <text x="178" y="258" class="text small">VIN: 3FADP0HR5LR123456</text>
  <text x="178" y="296" class="text small">Credit Pull: May 20, 2024</text>

