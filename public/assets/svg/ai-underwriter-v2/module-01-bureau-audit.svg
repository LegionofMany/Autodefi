    <text y="48" class="muted small">Recommended Tier</text><text x="360" y="48" class="text small" text-anchor="end">Tier 2</text>
    <text y="96" class="muted small">Credit Utilization</text><text x="360" y="96" class="green small" text-anchor="end">28%</text>
