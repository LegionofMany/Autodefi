  <rect x="1316" y="124" width="450" height="540" class="panel"/><text x="1350" y="168" class="text h2">Wallet Results</text><path d="M1410 360 A150 150 0 1 1 1670 360" fill="none" stroke="#10233c" stroke-width="34"/><path d="M1410 360 A150 150 0 0 1 1622 250" fill="none" stroke="url(#trust)" stroke-width="34" filter="url(#glow)"/><text x="1540" y="340" class="text num" text-anchor="middle">88%</text><text x="1540" y="382" class="text body" text-anchor="middle">Activity</text><text x="1350" y="472" class="muted small">Decision Impact</text><text x="1710" y="472" class="green small" text-anchor="end">+6%</text><text x="1350" y="520" class="muted small">Risk Adjustment</text><text x="1710" y="520" class="green small" text-anchor="end">-3%</text><text x="1350" y="568" class="muted small">V2 Shadow</text><text x="1710" y="568" class="yellow small" text-anchor="end">Behavior Learning</text>
  <rect x="26" y="690" width="1740" height="250" class="panel"/><text x="58" y="736" class="text h2">Wallet + Reason-Code Breakdown</text><text x="58" y="812" class="green body">Ownership Verified · KYC Link Matched · Age Established · Activity Healthy · Stable Rail Ready</text>
