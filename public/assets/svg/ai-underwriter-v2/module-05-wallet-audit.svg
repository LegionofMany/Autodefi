  <g transform="translate(890 244)"><rect width="170" height="150" class="panel-soft"/><text x="22" y="42" class="muted small">Score</text><text x="85" y="100" class="green num" text-anchor="middle">782</text></g>
  <g transform="translate(1088 244)"><rect width="170" height="150" class="panel-soft"/><text x="22" y="42" class="muted small">Activity</text><text x="85" y="100" class="green num" text-anchor="middle">88%</text></g>
