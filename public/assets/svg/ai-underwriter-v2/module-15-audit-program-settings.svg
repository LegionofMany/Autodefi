<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" role="img" aria-labelledby="title desc">
  <title id="title">AutoDeFi AI Underwriter V2 Audit Program Settings</title>
  <desc id="desc">Editable dark neon AutoDeFi Audit Program Settings dashboard SVG lock for AI Underwriter V2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#02040c"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#7c3cff"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#0ea5e9" stroke-opacity="0.08"/></pattern>
    <style>.panel{fill:#050d1c;stroke:#0ea5e9;stroke-opacity:.42;rx:18;filter:url(#glow)}.panel2{fill:#061426;stroke:#164e8b;stroke-opacity:.58;rx:16}.text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eef6ff}.muted{fill:#9eb3ca}.cyan{fill:#00e5ff}.green{fill:#39ff57}.yellow{fill:#ffd000}.purple{fill:#a855f7}.small{font-size:22px}.body{font-size:26px}.h2{font-size:38px;font-weight:800}.h1{font-size:48px;font-weight:900}.num{font-size:58px;font-weight:900}</style>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/><rect width="1792" height="1024" fill="url(#grid)" opacity="0.65"/>
  <rect x="24" y="22" width="230" height="78" class="panel2"/><path d="M78 72 L116 28 L154 72 L132 72 L116 48 L100 72 Z" fill="url(#brand)"/><text x="170" y="63" class="text body" font-weight="800">AutoDeFi</text>
