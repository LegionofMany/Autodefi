  <rect x="26" y="690" width="1740" height="250" class="panel"/><text x="58" y="736" class="text h2">Settings + Reason-Code Breakdown</text><text x="58" y="812" class="green body">V1 Production Enabled · V2 Shadow Locked · Human Promotion Required · Reason Codes Required · Rollback Ready · Audit Retention Locked</text>
