  <rect x="890" y="244" width="170" height="150" class="panel2"/><text x="912" y="286" class="muted small">Control</text><text x="975" y="342" class="purple num" text-anchor="middle">95%</text>
  <rect x="1088" y="244" width="170" height="150" class="panel2"/><text x="1110" y="286" class="muted small">Gate</text><text x="1173" y="342" class="yellow body" text-anchor="middle" font-weight="900">Human</text>
  <rect x="512" y="428" width="746" height="184" class="panel2"/><text x="540" y="470" class="text body">Program Control Signals</text><text x="540" y="520" class="muted small">V1 Decision Authority + V2 Mutation Control</text><text x="1228" y="520" class="green small" text-anchor="end">Enabled / Blocked</text><text x="540" y="568" class="muted small">Reason Codes + Rollback</text><text x="1228" y="568" class="cyan small" text-anchor="end">Required / Ready</text>
