  <rect x="470" y="124" width="820" height="540" class="panel"/><text x="512" y="168" class="text h2">15. AUDIT PROGRAM SETTINGS</text><text x="512" y="202" class="muted body">Shadow-mode policy, promotion gates, reason codes, retention, rollback, and model controls</text>
