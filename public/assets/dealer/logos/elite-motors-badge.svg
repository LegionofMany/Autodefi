  <text x="48" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="800" fill="#93c5fd">MOTORS</text>
  <circle cx="74" cy="22" r="9" fill="#075cff"/>
  <path d="m70 22 3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
