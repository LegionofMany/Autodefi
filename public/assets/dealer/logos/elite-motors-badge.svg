<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Elite Motors verified dealer badge</title>
  <desc id="desc">Circular Elite Motors dealer badge placeholder used by the locked Dealer Portal screens.</desc>
  <defs>
    <linearGradient id="badge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#020814" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="48" cy="48" r="37" fill="url(#badge)"/>
